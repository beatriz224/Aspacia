<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áspacia - Criações</title>
    <link rel="stylesheet" href="css/criacao.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Comforter&family=Lexend:wght@100..900&family=Modak&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/supabase-integracao.css">
</head>

<body>
    <header>
        <section class="conteinertudo">
            <div class="menu">
                <div class="pi">
                    <img class="logo" src="img/logo_site.png">
                    <h2 class="pitu">Criação</h2>
                </div>

                <ul class="abas">
                    <li class="item1"><a class="lo" href="index.html">Lar</a></li>
                    <li class="item1"><a class="lo" href="biografias/biografias.html">Biografias</a></li>
                    <li class="item1"><a class="lo" href="paraconhecer.html">Artistas para conhecer</a></li>
                    <li class="item1"><a class="lo" href="favoritos.html">Favoritos</a></li>
                    <li class="item1"><a class="lo" href="sobrenos.html">Sobre nós</a></li>
                </ul>
            </div>
        </section>
    </header>

    <main>
        <section class="conteiner-main">
            <article class="haha" id="minhas-criacoes-lista">
                <a href="obra.html">
                    <div class="it1">
                        <h4 class="a">+</h4>
                    </div>
                </a>
                <!-- Os textos criados pelo artista aparecerão aqui automaticamente -->
            </article>
        </section>
    </main>

    <footer>
        <section>
            <h3>Contatos</h3>
            <div class="contatos">
                <ul class="con">
                    <li><img class="img1" src="img/icons8-email-64.png">xxxxxx</li>
                    <li><img class="img2" src="img/icons8-github-64.png">xxxxx</li>
                    <li><img class="img3" src="img/icons8-instagram-logo-64.png">xxxx</li>
                    <li><img class="img4" src="img/icons8-whatsapp-64.png">xxxxx</li>
                </ul>
            </div>
        </section>
    </footer>

    <script type="module">
        import { inicializarBarraUsuario, buscarMinhasObras } from './js/aspacia-db.js';

        const perfil = await inicializarBarraUsuario();
        const container = document.getElementById('minhas-criacoes-lista');

        if (perfil) {
            const obras = await buscarMinhasObras(perfil.id);
            obras.forEach(obra => {
                const div = document.createElement('div');
                div.className = 'card-texto-aspacia';
                div.innerHTML = `
                    <small><strong>${obra.categoria}</strong></small>
                    <h3>${obra.titulo}</h3>
                    <p><em>${obra.sinopse || ''}</em></p>
                    <div class="card-texto-corpo">${obra.conteudo}</div>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>

</html>
